name: MegaCityCabs CI/CD

on:
  push:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'adopt'

    - name: Set up Maven
      run: |
        sudo apt update
        sudo apt install -y maven

    - name: Build Project
      run: |
        mvn clean compile

    - name: Run Unit Tests
      run: |
        mvn test

    - name: Package the Application
      run: |
        mvn package

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: MegaCityCabs-Build
        path: target/*.war
